# docker-compose.override.yml - 개발 환경 (자동 적용)
services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "5005:5005"           # Java 디버그 포트
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      - ./app/src:/app/src    # 소스 코드 마운트 (JAR로 실행하는 이 이미지는 재빌드해야 반영)
    restart: "no"             # 개발 중에는 자동 재시작 불필요

  db:
    ports:
      - "3306:3306"           # 로컬에서 직접 DB 접속 가능
    restart: "no"
