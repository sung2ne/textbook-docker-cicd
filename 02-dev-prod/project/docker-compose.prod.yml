# docker-compose.prod.yml - 프로덕션 환경
services:
  app:
    image: ${DOCKER_REGISTRY}/myapp:${APP_VERSION:-latest}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "1.0"
          memory: 1024M
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
